<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    <title>Museum</title>
</head>
<body>
    <header>
    </header>
    <main>
        <section id="welcome">
            <h1 class="forum text-huge">Welcome to the Louvre</h1>
            <p class="text-large text-lite text-spaced ">From the castle to the museum</p>
            <button class="accented" type="button"><span class="text-medium text-lite text-spaced">Discover the Louvre</span></button>
        </section>
        <section id="visiting">
            <h2 class="forum text-huge">Virtual tour</h2>
            <h3 class="forum text-xl text-sparse">Royal Palace</h3>
            <h3 class="forum text-xl text-sparse">Denon Wing</h3>
            <h3 class="forum text-xl text-sparse">Colonnade Perrault</h3>
            <h3 class="forum text-xl text-sparse">Greek hall</h3>
            <h3 class="forum text-xl text-sparse">Mona Lisa</h3>
            <h3 class="forum text-xl text-sparse">Night Palace</h3>
        </section>
        <section id="explore">
            <h2 class="forum text-huge">Picture explore</h2>
        </section>
        <section id="video">
            <h2 class="forum text-huge">Video journey</h2>
        </section>
        <section id="gallery">
            <h2 class="forum text-huge">Art Gallery</h2>
        </section>
        <section id="tickets">
            <h2 class="forum text-huge">Buy tickets</h2>
        </section>
        <section id="contacts">
            <h2 class="forum text-huge">Contacts</h2>
        </section>
    </main>
    <footer></footer>
